    <main class="content">

        <h1>Make an Enquiry</h1>

        <p>Use this form for questions about a Takealot service or product, or to enquire about becoming a seller, volunteer or sponsor.</p>
        <form class="enquiry-form" action="mailto:support@takealot.com" method="post" enctype="text/plain" data-recipient="support@takealot.com">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" autocomplete="name" minlength="2" maxlength="80" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" pattern="\+?[0-9]{7,15}" title="Enter 7 to 15 digits, with an optional leading plus sign and no spaces or punctuation.">

            <label for="service">What is your enquiry about?</label>

            <select id="service" name="enquiryType" required>
                <option value="" selected disabled>Select an enquiry type</option>
                <option value="products">Products or orders</option>
                <option value="delivery">Delivery and fulfilment</option>
                <option value="marketplace">Marketplace selling</option>
                <option value="volunteer">Volunteering</option>
                <option value="sponsorship">Sponsorship</option>
                <option value="other">Other service enquiry</option>
            </select>

            <label for="message">Your Enquiry:</label>

            <textarea id="message" name="message" rows="6" minlength="10" maxlength="2000" required></textarea>

            <button type="submit"><span class="button-icon" aria-hidden="true">➤</span>Submit Enquiry</button>
            <p class="form-status" role="status" aria-live="polite"></p>

        </form>

    </main>
